name: 大意の誤り
description: 大意の誤りや、よりよい大意を知らせる
title: "[訳] 石川啄木 詩篇（『日本の文学 15 石川啄木・正岡子規・高浜虚子』より） "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "行頭にある ID（例: ishikawa-takuboku-be3505b0-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの大意
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した大意
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
